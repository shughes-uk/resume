[workspace]
authors = ["shughes.uk <shughes.uk@gmail.com>"]
channels = ["conda-forge"]
description = "Add a short description here"
name = "resume"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[tasks]
frontend-build = { cmd = "npm run build", cwd = "frontend", depends-on = [
    "frontend-lint",
] }
frontend-deploy = { cmd = "python scripts/deploy_frontend.py", cwd = ".", depends-on = [
    "frontend-build",
] }
frontend-dev = { cmd = "npm run dev", cwd = "frontend" }
frontend-format = { cmd = "npm run format", cwd = "frontend" }
frontend-install = { cmd = "npm install", cwd = "frontend" }
frontend-preview = { cmd = "npm run preview", cwd = "frontend", description = "Serve the production build locally", depends-on = [
    "frontend-build",
] }
frontend-lint = { cmd = "npm run lint", cwd = "frontend", depends-on = [
    "frontend-install",
] }
resume-build = { depends-on = [
    "resume-pdf",
    "resume-docx",
], description = "Build the resume PDF and Word files from the Markdown source" }
resume-docx = { cmd = "pandoc frontend/public/Samantha_Hughes_Resume.md --lua-filter resume/filter.lua --reference-doc resume/reference.docx -o frontend/public/Samantha_Hughes_Resume.docx", description = "Build the resume Word file" }
resume-pdf = { cmd = "pandoc frontend/public/Samantha_Hughes_Resume.md --lua-filter resume/filter.lua --template resume/template.typ --pdf-engine typst --pdf-engine-opt=--ignore-system-fonts --pdf-engine-opt=--font-path=$CONDA_PREFIX/fonts -o frontend/public/Samantha_Hughes_Resume.pdf", description = "Build the resume PDF" }
terraform-apply = { cmd = "terraform apply", cwd = "terraform", depends-on = [
    "terraform-init",
] }
terraform-format = { cmd = "terraform fmt", cwd = "terraform" }
terraform-init = { cmd = "terraform init -input=false", cwd = "terraform" }
terraform-plan = { cmd = "terraform plan -input=false", cwd = "terraform", depends-on = [
    "terraform-init",
] }
terraform-validate = { cmd = "terraform init -backend=false -input=false && terraform validate", cwd = "terraform", description = "Check the terraform config without touching remote state", env = { TF_DATA_DIR = ".terraform-validate" } }
checks = { cmd = "pre-commit run --all-files", description = "Run every pre-commit hook over the repo" }
setup = { cmd = "pre-commit install", description = "Install dependencies and the git hook", depends-on = [
    "frontend-install",
] }

[dependencies]
awscli = ">=2.36.42,<3"
git = ">=2.55.0,<3"
nodejs = ">=26.8.2,<26.9"
pre-commit = ">=4.6.2,<5"
python = ">=3.14.7,<3.15"
terraform = ">=1.16.1,<2"
pandoc = ">=3.13,<4"
typst = ">=0.15.1,<0.16"
font-ttf-ibm-plex-sans = ">=1.1.0,<2"

[pypi-dependencies]
boto3 = ">=1.43.98, <2"
click = ">=8.5.0, <9"
ruff = ">=0.16.8, <0.17"
