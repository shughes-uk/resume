name: "Terraform Plan"
on:
  pull_request:

jobs:
  terraform:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: "us-east-1"
          mask-aws-account-id: true
      - uses: prefix-dev/setup-pixi@v0.5.1
        with:
          cache: true
          locked: true
      - name: Terraform Plan
        id: plan
        run: |
          pixi run terraform-plan -no-color -lock=false 2>&1 | tee plan.txt
          exit "${PIPESTATUS[0]}"
      - name: Update PR
        if: always()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            // Only the summary line is posted: the full plan contains ARNs with the account ID,
            // and this repo is public. The full plan is in the (masked) workflow log.
            const plan = fs.existsSync("plan.txt") ? fs.readFileSync("plan.txt", "utf8") : "";
            const summary =
              plan.match(/^(Plan:.*|No changes\..*)$/m)?.[0] ?? "Plan failed, see the workflow run.";
            const body = `#### Terraform Plan Output
            ${summary}

            [Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            // Replace the previous plan comment so the PR timeline stays readable
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(
              (comment) =>
                comment.user.type === "Bot" &&
                comment.body.includes("Terraform Plan Output"),
            );
            if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
              });
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
