name: CI
on: push
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          cache: true
          locked: true
      - name: npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: pixi run npm ci
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      # The production build and terraform validate need no credentials, so they run
      # here rather than in the preview job: Dependabot PRs get no secrets or OIDC
      # token, and automerge gates on this workflow.
      - name: Build frontend
        run: pixi run frontend-build
      - name: Validate terraform
        run: pixi run terraform-validate
