repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-ast
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.1
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      - name: frontend-lint
        id: frontend-lint
        description: Run frontend linting.
        language: system
        types_or: [ts, tsx, jsx, javascript]
        entry: pixi run frontend-lint
        pass_filenames: false
      - name: frontend-format
        id: frontend-format
        description: Run frontend formatting.
        language: system
        types_or: [ts, tsx, jsx, javascript]
        entry: pixi run frontend-format
        pass_filenames: false
      - name: resume-build
        id: resume-build
        description: Rebuild the resume PDF and Word files so they match the Markdown.
        language: system
        files: ^(frontend/public/Samantha_Hughes_Resume\.(md|pdf|docx)|resume/.*|pixi\.(toml|lock))$
        entry: pixi run resume-build
        pass_filenames: false
